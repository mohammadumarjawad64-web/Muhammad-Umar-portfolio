<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3340"/>
      <stop offset="50%" stop-color="#1e232d"/>
      <stop offset="100%" stop-color="#14171e"/>
    </linearGradient>
    <linearGradient id="skinG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4eb"/>
      <stop offset="100%" stop-color="#e2cfb9"/>
    </linearGradient>
    <linearGradient id="hairG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3038"/>
      <stop offset="100%" stop-color="#17191e"/>
    </linearGradient>
    <linearGradient id="shirtG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="ringG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="200" fill="url(#bgG)"/>

  <!-- Decorative Outer Tech Orbit -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#ringG)" stroke-width="3" stroke-dasharray="12 8" opacity="0.6"/>
  <circle cx="200" cy="200" r="165" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Glowing Aura -->
  <circle cx="200" cy="200" r="140" fill="#3b82f6" opacity="0.12"/>

  <!-- Head & Neck -->
  <rect x="186" y="195" width="28" height="40" rx="8" fill="url(#skinG)"/>
  <ellipse cx="200" cy="150" rx="55" ry="62" fill="url(#skinG)"/>

  <!-- Hair Style -->
  <path d="M142 140 C140 88, 178 72, 204 72 C236 72, 258 90, 256 138 C242 118, 222 108, 200 108 C176 108, 154 122, 142 140 Z" fill="url(#hairG)"/>
  <path d="M140 145 C140 120, 148 105, 158 98 C148 112, 144 130, 144 148 Z" fill="url(#hairG)"/>

  <!-- Ears -->
  <ellipse cx="143" cy="155" rx="8" ry="14" fill="url(#skinG)"/>
  <ellipse cx="257" cy="155" rx="8" ry="14" fill="url(#skinG)"/>

  <!-- Glasses / Modern Developer Look -->
  <rect x="154" y="140" width="36" height="24" rx="7" fill="none" stroke="#2563eb" stroke-width="3.5"/>
  <rect x="210" y="140" width="36" height="24" rx="7" fill="none" stroke="#2563eb" stroke-width="3.5"/>
  <line x1="190" y1="150" x2="210" y2="150" stroke="#2563eb" stroke-width="3.5"/>

  <!-- Body / Hoodie / Shirt -->
  <path d="M95 340 C95 245, 142 225, 200 225 C258 225, 305 245, 305 340 Z" fill="url(#shirtG)"/>
  
  <!-- Collar / Badge -->
  <polygon points="180,225 220,225 200,270" fill="#f8fafc" opacity="0.95"/>
  <circle cx="200" cy="305" r="26" fill="#1e222a" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <text x="200" y="313" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">MU</text>

  <!-- Laptop / Code bar hint at bottom -->
  <path d="M130 365 L270 365 L255 385 L145 385 Z" fill="#475569" opacity="0.8"/>
</svg>
