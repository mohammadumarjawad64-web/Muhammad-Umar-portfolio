<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Umar | Computer Science Student</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo" id="logo">MU</div>
            <ul class="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#experience">Experience</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#education">Education</a></li>
            </ul>
            <div class="menu-btn"><i class="fas fa-bars"></i></div>
        </nav>
    </header>

    <main>
        <!-- Hero Section -->
        <section id="hero" class="hero-section">
            <div class="container hero-layout">
                <div class="hero-content">
                    <h1 id="hero-name">Loading...</h1>
                    <h2 id="hero-label">...</h2>
                    <p id="hero-headline" class="headline"></p>
                    <div class="hero-cta">
                        <a href="#skills" class="btn btn-primary">View Skills</a>
                        <a href="#projects" class="btn btn-secondary">See Projects</a>
                    </div>
                    <div class="social-links" id="social-links">
                        <!-- Dynamic -->
                    </div>
                </div>
                <div class="hero-avatar-container">
                    <div class="hero-avatar-wrapper">
                        <img id="hero-image" src="images/profile.svg" alt="Muhammad Umar" class="hero-avatar-img">
                    </div>
                </div>
            </div>
            <div class="hero-bg-blobs">
                <div class="blob blob-1"></div>
                <div class="blob blob-2"></div>
            </div>
        </section>

        <!-- About Section -->
        <section id="about" class="section">
            <div class="container">
                <h2 class="section-title">About Me</h2>
                <div class="about-grid">
                    <div class="about-text" id="about-intro">
                        <!-- Dynamic -->
                    </div>
                    <div class="about-stats" id="about-metrics">
                        <!-- Dynamic -->
                    </div>
                </div>
                <div class="pillars-grid" id="leadership-pillars">
                    <!-- Dynamic -->
                </div>
            </div>
        </section>

        <!-- Skills Section -->
        <section id="skills" class="section bg-light">
            <div class="container">
                <h2 class="section-title">Technical Expertise</h2>
                <div class="skills-container" id="skills-grid">
                    <!-- Dynamic -->
                </div>
            </div>
        </section>

        <!-- Experience Section -->
        <section id="experience" class="section">
            <div class="container">
                <h2 class="section-title">Work Experience</h2>
                <div class="timeline" id="work-experience">
                    <!-- Dynamic -->
                </div>
            </div>
        </section>

        <!-- Projects Section -->
        <section id="projects" class="section bg-light">
            <div class="container">
                <h2 class="section-title">Featured Projects</h2>
                <div class="projects-grid" id="projects-grid">
                    <!-- Dynamic -->
                </div>
            </div>
        </section>

        <!-- Education Section -->
        <section id="education" class="section">
            <div class="container">
                <h2 class="section-title">Education & Certifications</h2>
                <div class="edu-cert-grid">
                    <div class="education-list" id="education-list">
                        <!-- Dynamic -->
                    </div>
                    <div class="cert-list" id="cert-list">
                        <!-- Dynamic -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; <span id="current-year"></span> <span id="footer-name">Muhammad Umar</span>. Aspiring Computer Scientist.</p>
            <div class="footer-social" id="footer-social">
                <!-- Dynamic -->
            </div>
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
